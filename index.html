<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="countdown-container">
    <h1>الوقت المتبقي على الدراسة في مدرسة طلائع الوادي</h1>
    <div class="countdown">
      <div class="time-unit">
        <span id="days">0</span>
        <span>أيام</span>
      </div>
      <div class="time-unit">
        <span id="hours">0</span>
        <span>ساعات</span>
      </div>
      <div class="time-unit">
        <span id="minutes">0</span>
        <span>دقائق</span>
      </div>
      <div class="time-unit">
        <span id="seconds">0</span>
        <span>ثواني</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
